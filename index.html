<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คอนโด</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="คอนโด">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --page:#f2f2f7; --bg:#ffffff; --ink:#000000; --ink2:#48484a; --mute:#8e8e93;
  --line:#e5e5ea; --axis:#c7c7cc; --soft:#f2f2f7; --fill:rgba(118,118,128,.12); --segon:#ffffff; --wash:rgba(0,0,0,.05);
  --key:#007aff; --onkey:#ffffff; --in:#248a3d; --out:#d70015;
  --s1:#007aff; --s2:#ff9500; --s3:#af52de; --neg:#ff3b30; --track:rgba(120,120,128,.16);
  --ring:rgba(0,0,0,.08); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --glass:rgba(249,249,249,.82);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --navh:58px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#000000; --bg:#1c1c1e; --ink:#ffffff; --ink2:#d1d1d6; --mute:#8e8e93;
    --line:#38383a; --axis:#48484a; --soft:#2c2c2e; --fill:rgba(118,118,128,.24); --segon:#636366; --wash:rgba(255,255,255,.08);
    --key:#0a84ff; --in:#30d158; --out:#ff453a;
    --s1:#0a84ff; --s2:#ff9f0a; --s3:#bf5af2; --neg:#ff453a; --track:rgba(120,120,128,.32);
    --ring:rgba(255,255,255,.12); --shadow:none;
    --glass:rgba(28,28,30,.82);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Sarabun","Noto Sans Thai","Segoe UI",Roboto,sans-serif;
 font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ===== โครงหน้า: มือถือ = แถบล่าง / จอใหญ่ = แถบข้าง ===== */
#app{display:none;min-height:100vh;min-height:100dvh}
#app.on{display:block}
.main{max-width:640px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--navh) + var(--sb) + 110px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 4px 18px}
.top h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:.3px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:4px;
 padding:6px 12px calc(6px + var(--sb));background:var(--glass);
 -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
 border-top:.5px solid var(--line)}
#nav .brand{display:none}
#nav button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;
 background:none;border:0;color:var(--mute);font-size:11px;font-weight:500;cursor:pointer;border-radius:10px}
#nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--key)}
#nav button:focus-visible{outline:2px solid var(--key);outline-offset:1px}

/* ===== จัดกลุ่มแบบ iOS ===== */
.sh{font-size:13px;color:var(--mute);margin:22px 16px 7px;letter-spacing:.2px;text-transform:none}
.group{background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.group+.group,.group+.sh{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{margin:0;font-size:16px;color:var(--ink);flex:0 0 auto;min-width:74px}
input,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-radius:0;
 padding:14px 0;appearance:none;-webkit-appearance:none;min-width:0}
.row input,.row select{text-align:right;text-align-last:right;flex:1}
input:focus,select:focus{outline:none}
.row:focus-within{background:var(--wash)}
input::placeholder{color:var(--mute);opacity:.75}
select{padding-right:20px;cursor:pointer;
 background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='13'%3E%3Cpath d='M1 1.5l5 5-5 5' stroke='%23c7c7cc' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
 background-repeat:no-repeat;background-position:right 2px center}
input[type=date]{min-height:44px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.chip{padding:9px 2px;text-align:center;border-radius:9px;font-size:15px;cursor:pointer;user-select:none;color:var(--ink);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.chip.on{background:var(--segon);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.1)}

.amt{padding:18px 16px 14px;text-align:center}
.amt label{display:block;font-size:13px;color:var(--mute);margin:0 0 2px}
#amount{font-size:46px;font-weight:700;text-align:center;letter-spacing:-1px;padding:2px 0 4px;line-height:1.15}
.split{display:none}
.split.on{display:block}
.note{font-size:13px;padding:10px 16px 12px;line-height:1.45}
.note:empty{display:none}
.note.bad{color:var(--out)} .note.good{color:var(--in)}

.go{width:100%;margin-top:18px;padding:16px;font-size:17px;font-weight:600;color:var(--onkey);background:var(--key);
 border:0;border-radius:14px;cursor:pointer;letter-spacing:.1px;transition:transform .1s,opacity .15s}
.go:active{transform:scale(.985);opacity:.9}
.go:disabled{opacity:.45}
.link{display:block;width:100%;margin-top:6px;padding:12px;background:none;border:0;font-size:15px;color:var(--key);cursor:pointer}
.link.quiet{color:var(--mute);font-size:13px}

.r{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line)}
.r:last-child{border:0}
.r .tx{flex:1;min-width:0}
.r .tx b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .tx small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.r .vl{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px;font-weight:600}
.empty{font-size:14px;color:var(--mute);padding:18px 16px;text-align:center}
.meta{margin:14px 16px 0;font-size:12px;color:var(--mute);line-height:1.7;text-align:center}

/* แจ้งเตือนลอย */
.bar{position:fixed;left:50%;bottom:calc(var(--navh) + var(--sb) + 14px);transform:translateX(-50%);z-index:60;
 width:calc(100% - 32px);max-width:420px;padding:12px 14px 12px 18px;border-radius:16px;color:#fff;font-size:15px;
 display:none;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.bar.on{display:flex}
.bar.ok{background:rgba(44,44,46,.94)} .bar.no{background:rgba(215,0,21,.94)}
.bar b{font-weight:500;flex:1}
.bar button{background:rgba(255,255,255,.18);border:0;color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}

/* ล็อกอิน */
#lock{display:none;max-width:400px;margin:0 auto;padding:calc(var(--st) + 14vh) 24px 40px;text-align:center}
#lock .ic{width:84px;height:84px;border-radius:19px;box-shadow:0 6px 20px rgba(0,0,0,.18);margin:0 auto 20px;display:block}
#lock h1{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:.2px}
#lock p{font-size:15px;color:var(--mute);margin:0 0 28px}
#pinErr{font-size:13px;color:var(--out);min-height:20px;margin-top:14px}

/* ===== ภาพรวม ===== */
.filters{margin:0 -16px 14px;padding:0 16px}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.frow .cap{display:none}
.pill{flex:0 0 auto;padding:8px 16px;border:0;border-radius:999px;font-size:15px;cursor:pointer;user-select:none;background:var(--bg);color:var(--ink);box-shadow:var(--shadow)}
.pill.on{background:var(--key);color:#fff;font-weight:600}
.card{background:var(--bg);border-radius:20px;padding:18px 18px 14px;margin-bottom:14px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:17px;font-weight:600;letter-spacing:.1px}
.card .sub{font-size:13px;color:var(--mute);margin:2px 0 12px}
.hero{padding:22px 20px 20px}
.hero .lbl{font-size:14px;color:var(--mute);font-weight:500}
.hero .big{font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1.1;margin:4px 0 0}
.hero .big small{font-size:22px;font-weight:600;letter-spacing:0;color:var(--ink2);margin-left:8px}
.hero .line{font-size:15px;color:var(--ink2);margin-top:4px}
.hero .fine{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5}
.meter{height:10px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:16px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:999px}
.mlab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--bg);border-radius:18px;padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.tile .lbl{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tile .key{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tile .val{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-top:3px;line-height:1.25;font-variant-numeric:tabular-nums}
.tile .sm{font-size:12px;color:var(--mute);margin-top:1px}
.tiles.t3{grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.t3 .tile{padding:12px 12px}
.tiles.t3 .val{font-size:17px}
.grid2{display:grid;grid-template-columns:1fr;gap:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:inherit;fill:var(--mute);font-size:11px}
.chart .vt{fill:var(--ink);font-size:12px;font-weight:600}
.hit{fill:transparent;cursor:default}
.hit:focus{outline:none}
.hit:focus-visible{fill:var(--wash)}
.hb{display:grid;grid-template-columns:minmax(72px,120px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb .trk{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.hb .fil{height:12px;border-radius:999px;min-width:6px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink);font-size:14px;font-weight:500}
.rr{padding:14px 0;border-bottom:.5px solid var(--line)}
.rr:last-child{border:0;padding-bottom:2px}
.rr:first-child{padding-top:2px}
.rr .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rr .rt b{font-size:16px}
.rr .rt span{font-size:13px;color:var(--mute);margin-left:8px}
.rr .pf{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.rr .meter{height:8px;margin-top:10px}
.tabwrap{overflow-x:auto;margin-top:10px}
table.tb{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.tb th,table.tb td{padding:8px 8px;text-align:right;border-bottom:.5px solid var(--line);white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb th{color:var(--mute);font-weight:500}
details.more>summary{cursor:pointer;font-size:16px;color:var(--key);list-style:none;font-weight:500}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:' ›';display:inline-block;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(90deg)}
details.more[open]>summary{margin-bottom:14px}
.more h4{font-size:15px;font-weight:600;margin:22px 0 8px}
.more .fine{font-size:12px;color:var(--mute);margin-top:16px;line-height:1.5}
.tip{position:fixed;z-index:70;display:none;pointer-events:none;background:var(--bg);color:var(--ink);
 border:.5px solid var(--ring);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:240px}
.tip .th{color:var(--mute);margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;line-height:1.55}
.tip .tk{width:12px;height:4px;border-radius:2px;flex-shrink:0}
.tip .tv{font-weight:600;font-variant-numeric:tabular-nums}
.tip .tl{color:var(--ink2)}
.dim{opacity:.5;transition:opacity .15s}
.foot{font-size:12px;color:var(--mute);margin:12px 0 0;display:flex;justify-content:center;gap:14px;align-items:center}
.foot button{background:none;border:0;color:var(--key);font-size:12px;cursor:pointer;padding:0}

/* ===== แท็บเล็ต / จอใหญ่ ===== */
@media (min-width:700px){
  .main{max-width:760px;padding-left:24px;padding-right:24px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tiles.t3 .val{font-size:22px}
  .tiles.t3 .tile{padding:14px 16px}
  .grid2{grid-template-columns:1fr 1fr;gap:14px}
  .hero .big{font-size:76px}
}
@media (min-width:1000px){
  #app{display:none}
  #app.on{display:grid;grid-template-columns:248px minmax(0,1fr)}
  #nav{position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;
    padding:calc(var(--st) + 28px) 16px 24px;border-top:0;border-right:.5px solid var(--line);
    background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  #nav .brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;margin:0 8px 26px}
  #nav .brand img{width:38px;height:38px;border-radius:9px}
  #nav button{flex:none;max-width:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:16px;border-radius:12px;color:var(--ink2)}
  #nav button svg{width:22px;height:22px}
  #nav button:hover{background:var(--fill)}
  #nav button.on{background:var(--key);color:#fff}
  .main{max-width:1120px;width:100%;padding:calc(var(--st) + 34px) 40px 80px}
  .top h1{font-size:38px}
  #viewLog{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:0 40px;align-items:start}
  #viewLog .sideCol .sh:first-child{margin-top:2px}
  #dashBody{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  #dashBody>.hero,#dashBody>.tiles,#dashBody>.grid2,#dashBody>details,#dashBody>.empty{grid-column:1/-1}
  .bar{bottom:28px}
  .filters{margin:0 0 16px;padding:0}
  .tiles.t3 .val{font-size:26px}
  .hero .big{font-size:88px}
}
@media (min-width:1400px){ .main{padding-left:56px;padding-right:56px} }
@media (max-width:360px){ .top h1{font-size:30px} #amount{font-size:40px} .hero .big{font-size:56px} .tiles.t3 .val{font-size:15px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div id="lock">
  <img class="ic" src="icon-192.png" alt="">
  <h1>บันทึกค่าใช้จ่ายคอนโด</h1>
  <p>เข้าสู่ระบบด้วย Gmail ที่ได้รับอนุญาต</p>
  <div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>
  <div id="pinErr"></div>
</div>

<div id="app">
  <nav id="nav" aria-label="เมนูหลัก">
    <div class="brand"><img src="icon-192.png" alt=""><span>คอนโด</span></div>
    <button id="tabLog" class="on"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span>บันทึก</span></button>
    <button id="tabDash"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span>ภาพรวม</span></button>
  </nav>

  <main class="main">
    <header class="top"><h1 id="ttl">บันทึก</h1></header>

    <!-- ===== บันทึก ===== -->
    <div id="viewLog">
      <section class="formCol">
        <div class="seg2" id="rooms" role="tablist" aria-label="ห้อง"></div>

        <div class="group amt" style="margin-top:16px">
          <label for="amount">จำนวนเงิน (บาท)</label>
          <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="group">
          <div class="row"><label for="cat">หมวด</label>
            <select id="cat"><option value="">เลือกหมวด</option></select></div>
          <div class="row"><label for="item">รายการ</label>
            <input id="item" type="text" placeholder="เช่น ค่าซ่อมแอร์"></div>
        </div>

        <div class="group split" id="split">
          <div class="row"><label for="principal">เงินต้น</label><input id="principal" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
          <div class="row"><label for="interest">ดอกเบี้ย</label><input id="interest" type="number" inputmode="decimal" step="0.01" placeholder="ติดลบได้ ถ้าธนาคารคืน"></div>
          <div class="note" id="splitNote"></div>
        </div>

        <div class="group">
          <div class="row"><label for="date">วันที่</label><input id="date" type="date"></div>
          <div class="row"><label for="note">หมายเหตุ</label><input id="note" type="text" placeholder="ไม่ใส่ก็ได้"></div>
        </div>

        <button class="go" id="save">บันทึก</button>
        <button class="link" id="monthly">สร้างรายการประจำเดือน</button>
      </section>

      <section class="sideCol">
        <div class="sh">ล่าสุด</div>
        <div class="group" id="recent"></div>
        <div class="meta" id="meta"></div>
        <button class="link quiet" id="logout">ออกจากระบบ</button>
      </section>
    </div>

    <!-- ===== ภาพรวม ===== -->
    <div id="viewDash" style="display:none">
      <div class="filters"><div class="frow" id="fRoom"><span class="cap">ห้อง</span></div></div>
      <div id="dashBody"></div>
      <div class="foot"><span id="dashStamp"></span><button id="dashRefresh">รีเฟรชข้อมูล</button></div>
    </div>
  </main>
</div>

<div class="bar" id="bar"><b id="barTxt"></b><button id="barBtn">เลิกทำ</button></div>
<div class="tip" id="tip"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===== ตั้งค่า: URL ของ Web app (Apps Script) ===== */
var CLIENT_ID = '1008403198159-d8i1asj7drku9uotinvvog5qncdoaji0.apps.googleusercontent.com';
var API_URL = 'https://script.google.com/macros/s/AKfycbwuhbSkIERP20xvtIP0n75xuhp7io_OVCYN0dBIqYGcAaSX4J6oFBwSiFDO8VZnX7Q/exec';

var BOOT=null, ROOM='', LASTROW=0, TOKEN='', AUTO_AMT=false, AUTO_ITEM=false, BUSY=false;
var DASH=null, DASH_AT=0, DASH_STALE=true, F={room:'all',range:'all'}, VIEW='log';
var $=function(id){return document.getElementById(id);};
var baht=function(n){return (n<0?'-':'')+'฿'+Math.abs(Math.round(n)).toLocaleString('en-US');};
var num=function(n){return Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});};

/* ===== เรียก API ===== */
function waitTok(){
  if(tokValid(TOKEN)||!STARTED) return Promise.resolve();
  if(GIS_READY) try{ google.accounts.id.prompt(); }catch(e){}
  return new Promise(function(res){
    var n=0, t=setInterval(function(){ if(tokValid(TOKEN)||++n>20){ clearInterval(t); res(); } },250);
  });
}
function api(action, payload){
  if(API_URL.indexOf('PASTE')===0) return Promise.reject(new Error('CONFIG'));
  return waitTok().then(function(){
    return fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // ห้ามใช้ application/json (จะติด CORS preflight)
      body:JSON.stringify(Object.assign({action:action, token:TOKEN}, payload||{}))
    });
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.error){
        if(STARTED && (j.error==='AUTH_EXPIRED'||j.error==='AUTH_REQUIRED')) needLogin('หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่');
        throw new Error(j.error);
      }
      return j;
    });
}
function errText(e){
  var m=(e&&e.message)||'';
  if(m==='NOT_ALLOWED') return 'อีเมลนี้ไม่ได้รับอนุญาตให้ใช้งาน';
  if(m==='AUTH_EXPIRED'||m==='AUTH_REQUIRED') return 'หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่';
  if(m==='CONFIG')      return 'ยังไม่ได้ใส่ URL ของ Web app ในไฟล์ index.html';
  if(m.indexOf('JSON')>=0 || m==='Failed to fetch' || m==='Load failed' || m==='NetworkError when attempting to fetch resource.')
    return 'เชื่อมต่อไม่สำเร็จ ตรวจอินเทอร์เน็ต หรืออาจใช้โควตา Apps Script เต็ม ลองใหม่อีกครั้ง';
  return m||'เกิดข้อผิดพลาด';
}

/* ===== เข้าสู่ระบบด้วย Google ===== */
var TOK_KEY='condoTok', GIS_READY=false, STARTED=false;
function jwtExp(t){ try{ var p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(atob(p)).exp||0; }catch(e){ return 0; } }
function tokValid(t){ return !!t && jwtExp(t) > Date.now()/1000 + 120; }
function showLock(msg){
  $('app').classList.remove('on'); $('lock').style.display='block';
  $('pinErr').textContent=msg||'';
}
function gotToken(t){
  TOKEN=t; try{ localStorage.setItem(TOK_KEY,t); }catch(e){}
  if(STARTED){ $('lock').style.display='none'; $('app').classList.add('on'); return; }
  $('pinErr').textContent='กำลังเข้าสู่ระบบ...';
  api('bootstrap').then(function(b){
    STARTED=true; $('lock').style.display='none'; $('app').classList.add('on'); init(b);
  }).catch(function(e){
    var m=(e&&e.message)||'', auth=/AUTH_|NOT_ALLOWED/.test(m);
    if(auth){ try{ localStorage.removeItem(TOK_KEY); }catch(x){} TOKEN=''; showLock(errText(e)); renderGBtn(); }
    else { showLock(errText(e)+' (กำลังลองใหม่)'); setTimeout(function(){ if(!STARTED && TOKEN) gotToken(TOKEN); },4000); }
  });
}
function renderGBtn(){
  if(!GIS_READY) return;
  google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',locale:'th',width:260});
}
function needLogin(msg){ showLock(msg||'กรุณาเข้าสู่ระบบ'); renderGBtn(); if(GIS_READY) try{ google.accounts.id.prompt(); }catch(e){} }
function initGIS(){
  if(GIS_READY) return;
  if(!window.google||!google.accounts||!google.accounts.id){ setTimeout(initGIS,200); return; }
  google.accounts.id.initialize({client_id:CLIENT_ID, callback:function(r){ gotToken(r.credential); },
    auto_select:true, cancel_on_tap_outside:false, use_fedcm_for_prompt:true});
  GIS_READY=true;
  if(!TOKEN) needLogin(''); else renderGBtn();
}
window.addEventListener('DOMContentLoaded',function(){
  $('logout').onclick=function(){
    try{ localStorage.removeItem(TOK_KEY); if(window.google&&google.accounts) google.accounts.id.disableAutoSelect(); }catch(e){}
    TOKEN=''; location.reload();
  };
  var saved=''; try{ saved=localStorage.getItem(TOK_KEY)||''; }catch(e){}
  $('lock').style.display='block';
  if(tokValid(saved)){ TOKEN=saved; gotToken(saved); }
  initGIS();
});

/* ===== แท็บ ===== */
function setView(v){
  VIEW=v;
  $('viewLog').style.display = v==='log' ? '' : 'none';
  $('viewDash').style.display = v==='dash' ? '' : 'none';
  $('tabLog').classList.toggle('on', v==='log');
  $('tabDash').classList.toggle('on', v==='dash');
  $('ttl').textContent = v==='log' ? 'บันทึก' : 'ภาพรวม';
  hideTip();
  window.scrollTo(0,0);
  if(v==='dash') loadDash(false);
}

/* ===== หน้าบันทึก ===== */
function init(b){
  BOOT=b;
  $('date').value=b.today;
  $('tabLog').onclick=function(){ setView('log'); };
  $('tabDash').onclick=function(){ setView('dash'); };

  var rw=$('rooms'); rw.innerHTML='';
  b.rooms.concat([{name:'ส่วนตัว'}]).forEach(function(r){
    var d=document.createElement('div'); d.className='chip'; d.textContent=r.name; d.setAttribute('role','tab');
    d.onclick=function(){ ROOM=r.name;
      [].forEach.call(rw.children,function(c){c.classList.remove('on');});
      d.classList.add('on'); autofill(); };
    rw.appendChild(d);
  });

  var sel=$('cat'), gs={};
  b.cats.forEach(function(c){ (gs[c.group]=gs[c.group]||[]).push(c.name); });
  ['รายรับ','จ่ายประจำ','ลงทุน','ไม่นับ'].forEach(function(g){
    if(!gs[g]) return;
    var og=document.createElement('optgroup'); og.label=g;
    gs[g].forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent=n; og.appendChild(o); });
    sel.appendChild(og);
  });
  sel.onchange=function(){ sync(); autofill(); };

  ['principal','interest'].forEach(function(id){ $(id).oninput=checkSplit; });
  $('amount').oninput=function(){ AUTO_AMT=false; checkSplit(); };
  $('item').oninput=function(){ AUTO_ITEM=false; };
  $('date').onchange=autofill;
  $('save').onclick=save;
  $('monthly').onclick=monthly;
  $('barBtn').onclick=undo;
  $('dashRefresh').onclick=function(){ loadDash(true); };
  buildFilters();
  window.addEventListener('resize',function(){ clearTimeout(window._rz); window._rz=setTimeout(function(){ if(VIEW==='dash' && DASH) renderDash(); },150); });
  render(b.recent); meta();
  sync();
  window.addEventListener('online',flushQueue);
  flushQueue();
}

function group(){
  var c=$('cat').value; if(!c||!BOOT) return '';
  for(var i=0;i<BOOT.cats.length;i++) if(BOOT.cats[i].name===c) return BOOT.cats[i].group;
  return '';
}
function tone(g){ return g==='รายรับ'?'var(--in)':g==='ไม่นับ'?'var(--mute)':'var(--out)'; }
function sync(){
  var g=group();
  $('amount').style.color = g ? tone(g) : 'var(--ink)';
  $('split').classList.toggle('on', $('cat').value==='ค่างวด');
  checkSplit();
}
function autoName(c){
  var d=($('date').value||'').split('-');
  return d.length===3 ? c+'เดือน '+Number(d[1])+'/'+d[0] : '';
}
function autofill(){
  if(!BOOT) return;
  var c=$('cat').value, r=null;
  BOOT.rooms.forEach(function(x){ if(x.name===ROOM) r=x; });
  var v = (!r||!c) ? 0 : (c==='ค่างวด'?r.inst : c==='ค่าประกัน'?r.ins : c==='ค่าเช่า'?r.rent : 0);

  if(v>0){
    if(AUTO_AMT || $('amount').value===''){ $('amount').value=v; AUTO_AMT=true; }
  } else if(AUTO_AMT){ $('amount').value=''; AUTO_AMT=false; }

  var nm = (c==='ค่างวด'||c==='ค่าเช่า') ? autoName(c) : '';
  if(nm){
    if(AUTO_ITEM || $('item').value===''){ $('item').value=nm; AUTO_ITEM=true; }
  } else if(AUTO_ITEM){ $('item').value=''; AUTO_ITEM=false; }

  checkSplit();
}
/* คืนค่า true ถ้าเงินต้น+ดอกเบี้ยตรงกับยอด หรือยังไม่กรอก */
function checkSplit(){
  var n=$('splitNote');
  if($('cat').value!=='ค่างวด'){ n.textContent=''; return true; }
  var a=Number($('amount').value)||0, p=$('principal').value, i=$('interest').value;
  if(p===''&&i===''){ n.className='note bad'; n.textContent='ยังไม่ได้กรอก บันทึกได้ แต่ชีทจะขึ้นเตือนจนกว่าจะกรอกครบ'; return true; }
  var s=Math.round(((Number(p)||0)+(Number(i)||0))*100)/100, t=Math.round(a*100)/100;
  if(s===t){ n.className='note good'; n.textContent='เงินต้นรวมดอกเบี้ย ตรงกับยอดจ่าย'; return true; }
  n.className='note bad'; n.textContent='ไม่ตรง รวมได้ '+num(s)+' ควรเป็น '+num(t)+' ต่างอยู่ '+num(t-s)+' (บันทึกไม่ได้จนกว่าจะตรงกัน)';
  return false;
}
function render(list){
  var el=$('recent'); el.textContent='';
  if(!list||!list.length){ H('div','empty','ยังไม่มีรายการ',el); return; }
  list.forEach(function(r){
    var d=H('div','r',null,el); if(r.pending) d.style.opacity='.5';
    var tx=H('div','tx',null,d);
    H('b',null,r.item||r.cat,tx); H('small',null,r.room+' · '+r.date+(r.item?' · '+r.cat:''),tx);
    var vl=H('span','vl',((r.group==='รายรับ')?'+':'-')+num(r.amount),d); vl.style.color=tone(r.group);
  });
}
function meta(){
  if(!BOOT) return;
  var k=BOOT.kpi||{balance:0,cash:0,bad:0};
  $('meta').textContent='';
  var l1=document.createElement('div');
  l1.textContent='เงินต้นคงเหลือรวม '+baht(k.balance)+'  ·  กระแสเงินสด/เดือน '+baht(k.cash);
  var l2=document.createElement('div');
  l2.textContent='เหลือที่ว่างอีก '+BOOT.remaining+' แถว'+(k.bad>0?'  ·  มี '+k.bad+' แถวที่ต้องแก้ในชีท':'');
  $('meta').appendChild(l1); $('meta').appendChild(l2);
}
function applyResult(res){
  DASH_STALE=true;
  render(res.recent);
  if(res.kpi) BOOT.kpi=res.kpi;
  if(typeof res.remaining==='number') BOOT.remaining=res.remaining;
  meta();
}

/* ===== บันทึกแบบ optimistic: ล้างฟอร์มทันที ส่งเบื้องหลัง มีคิวลองใหม่ และกันบันทึกซ้ำด้วยรหัส cid ===== */
var QKEY='condoQ', SENDING=false, MUT=0;   // MUT: นับการเปลี่ยนข้อมูล ใช้ทิ้งผลโหลดเก่าที่มาช้ากว่า
function qLoad(){ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } }
function qSave(a){ try{ localStorage.setItem(QKEY,JSON.stringify(a)); }catch(e){} }
function fmtD(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0].slice(2); }
function save(){
  if(!ROOM) return toast('ยังไม่ได้เลือกห้อง',false);
  if(!$('cat').value) return toast('ยังไม่ได้เลือกหมวด',false);
  if(!(Number($('amount').value)>0)) return toast('ยังไม่ได้ใส่จำนวนเงิน',false);
  if(!checkSplit()) return toast('เงินต้น + ดอกเบี้ย ต้องเท่ากับจำนวนเงิน',false);
  var data={cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    date:$('date').value, room:ROOM, cat:$('cat').value, item:$('item').value,
    amount:$('amount').value, principal:$('principal').value, interest:$('interest').value, note:$('note').value};
  MUT++; var q=qLoad(); q.push(data); qSave(q);
  BOOT.recent=[{cid:data.cid,row:0,date:fmtD(data.date),room:data.room,cat:data.cat,item:data.item,amount:Number(data.amount),group:group(),pending:true}].concat(BOOT.recent||[]).slice(0,6);
  render(BOOT.recent);
  ['amount','principal','interest','item','note'].forEach(function(id){ $(id).value=''; });
  AUTO_AMT=false; AUTO_ITEM=false; $('splitNote').textContent='';
  toast('กำลังส่ง... ป้อนรายการต่อได้เลย',true,true);
  flushQueue();
}
function restoreForm(it){
  ROOM=it.room; [].forEach.call($('rooms').children,function(c){ c.classList.toggle('on',c.textContent===it.room); });
  $('cat').value=it.cat; sync();
  $('amount').value=it.amount; $('principal').value=it.principal; $('interest').value=it.interest;
  $('item').value=it.item; $('note').value=it.note; $('date').value=it.date; checkSplit();
}
function recentMark(cid,row){
  BOOT.recent=(BOOT.recent||[]).map(function(r){ if(r.cid===cid){ if(row){ r.row=row; delete r.pending; } else return null; } return r; }).filter(Boolean);
  render(BOOT.recent);
}
function flushQueue(){
  if(SENDING) return;
  var q=qLoad(); if(!q.length){ return; }
  SENDING=true; var it=q[0];
  api('save',{data:it}).then(function(res){
    MUT++; qSave(qLoad().filter(function(x){ return x.cid!==it.cid; }));
    var left=qLoad().length;
    if(!res.ok){ recentMark(it.cid,0); restoreForm(it); toast(res.msg,false); }
    else {
      LASTROW=res.row; DASH_STALE=true;
      if(typeof BOOT.remaining==='number') BOOT.remaining=Math.max(0,BOOT.remaining-1);
      recentMark(it.cid,res.row); meta();
      toast('บันทึกแล้ว แถว '+res.row+(left?' · เหลืออีก '+left+' รายการ':''),true,left>0);
    }
    SENDING=false;
    if(left) flushQueue(); else refreshBoot();
  }).catch(function(e){
    SENDING=false; var m=(e&&e.message)||'';
    toast((m==='NOT_ALLOWED'||m==='AUTH_EXPIRED'||m==='AUTH_REQUIRED') ? errText(e) : 'ส่งไม่สำเร็จ เก็บไว้ในเครื่อง '+qLoad().length+' รายการ จะลองใหม่ให้เอง',false);
    clearTimeout(window._rt); window._rt=setTimeout(flushQueue,20000);
  });
}
/* โหลดรายการล่าสุด/ตัวเลขสรุปจากชีทเงียบ ๆ หลังส่งเสร็จ (ไม่บล็อกหน้าจอ) */
function refreshBoot(){
  if(SENDING || qLoad().length) return;
  var m0=MUT;
  api('bootstrap').then(function(b){
    if(SENDING || qLoad().length || MUT!==m0) return;
    BOOT.recent=b.recent; BOOT.kpi=b.kpi; BOOT.remaining=b.remaining; render(BOOT.recent); meta();
  }).catch(function(){});
}
function undo(){
  if(!LASTROW || BUSY || SENDING) return;
  BUSY=true; MUT++; var row=LASTROW;
  api('undo',{row:row}).then(function(res){
    if(!res.ok) return toast(res.msg,false);
    LASTROW=0; DASH_STALE=true; MUT++;
    BOOT.recent=(BOOT.recent||[]).filter(function(r){ return r.row!==row; });
    if(typeof BOOT.remaining==='number') BOOT.remaining+=1;
    render(BOOT.recent); meta();
    toast('ลบรายการล่าสุดแล้ว',true,true); refreshBoot();
  }).catch(function(e){ toast(errText(e),false); })
    .then(function(){ BUSY=false; });
}
function monthly(){
  if(BUSY) return;
  var d=($('date').value||BOOT.today).split('-');
  var s=prompt('สร้างรายการประจำเดือน — ใส่เดือนแบบ ดด/ปปปป', Number(d[1])+'/'+d[0]);
  if(!s) return;
  var m=s.trim().match(/^(\d{1,2})\s*\/\s*(\d{4})$/);
  if(!m) return toast('รูปแบบไม่ถูกต้อง ต้องเป็น ดด/ปปปป',false);
  run(m[1],m[2],false);
  function run(mm,yy,force){
    BUSY=true;
    api('monthly',{mm:mm,yy:yy,force:force}).then(function(res){
      BUSY=false;
      if(!res.ok && res.dup){ if(confirm(res.msg)) run(mm,yy,true); return; }
      if(!res.ok) return toast(res.msg,false);
      applyResult(res);
      toast('สร้าง '+res.n+' รายการแล้ว อย่าลืมกรอกเงินต้นและดอกเบี้ย',true,true);
    }).catch(function(e){ BUSY=false; toast(errText(e),false); });
  }
}
function toast(msg,ok,hide){
  var b=$('bar'); $('barTxt').textContent=msg;
  b.className='bar on '+(ok?'ok':'no');
  $('barBtn').style.display=(ok&&!hide&&LASTROW)?'block':'none';
  clearTimeout(window._t); window._t=setTimeout(function(){ b.className='bar'; },ok?6000:5000);
}

/* ================================================================
   ภาพรวม (dashboard) — ข้อมูลดิบมาจาก API แล้วคำนวณ/วาดกราฟที่นี่
   ================================================================ */
var TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var NS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function H(tag,cls,text,parent){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; if(parent) parent.appendChild(e); return e; }
function ym(d){ return d.slice(0,7); }
function mLabel(m,withYear){ var p=m.split('-'); return TH_M[Number(p[1])-1]+(withYear?' '+p[0]:''); }
function addMonths(m,n){ var p=m.split('-'), t=Number(p[0])*12+Number(p[1])-1+n; return Math.floor(t/12)+'-'+('0'+((t%12)+1)).slice(-2); }
function monthsBetween(a,b){ var out=[],m=a,g=0; while(m<=b && g++<240){ out.push(m); m=addMonths(m,1); } return out; }
function kfmt(n){ if(n===0) return '0'; var a=Math.abs(n); var s=a>=1000? (Math.round(a/100)/10).toString().replace(/\.0$/,'')+'k' : String(Math.round(a)); return (n<0?'-':'')+s; }

function buildFilters(){
  var fr=$('fRoom'); while(fr.children.length>1) fr.removeChild(fr.lastChild);
  ['all'].concat(BOOT.rooms.map(function(r){return r.name;})).forEach(function(n){
    var b=H('button','pill'+(F.room===n?' on':''),n==='all'?'ทุกห้อง':n,fr);
    b.onclick=function(){ F.room=n; buildFilters(); if(DASH) renderDash(); };
  });
}

function loadDash(force){
  if(!force && DASH && !DASH_STALE && Date.now()-DASH_AT<300000){ renderDash(); return; }
  var body=$('dashBody');
  if(DASH) body.classList.add('dim'); else { body.textContent=''; H('div','empty','กำลังโหลดข้อมูล...',body); }
  api('dashboard').then(function(d){
    DASH=d; DASH_AT=Date.now(); DASH_STALE=false; body.classList.remove('dim'); renderDash();
  }).catch(function(e){
    body.classList.remove('dim');
    if(!DASH){ body.textContent=''; H('div','empty',errText(e),body); }
    else toast(errText(e),false);
  });
}

/* ---- คำนวณ ---- */
function compute(){
  var D=DASH, grp={}; D.cats.forEach(function(c){ grp[c.name]=c.group; });
  var allRooms=D.rooms.map(function(r){return r.name;});
  var sel = F.room==='all' ? allRooms : [F.room];
  var propRows=D.rows.filter(function(r){ return allRooms.indexOf(r.r)>=0; });
  var rows=propRows.filter(function(r){ return sel.indexOf(r.r)>=0; });
  var todayM=ym(D.today), first=todayM, last=todayM;
  propRows.forEach(function(r){ var m=ym(r.d); if(m<first) first=m; if(m>last) last=m; });
  var months=monthsBetween(first,last), M={};
  months.forEach(function(m){ M[m]={rent:0,opex:0,inv:0}; });
  rows.forEach(function(r){
    var g=grp[r.c], m=M[ym(r.d)]; if(!m) return;
    if(g==='รายรับ') m.rent+=r.a; else if(g==='จ่ายประจำ') m.opex+=r.a; else if(g==='ลงทุน') m.inv+=r.a;
  });
  var nR = F.range==='all' ? months.length : Math.min(months.length, Number(F.range));
  var rm = months.slice(months.length-nR), inR={}; rm.forEach(function(m){ inR[m]=1; });

  var series=months.map(function(m){ return {m:m,rent:M[m].rent,opex:M[m].opex,inv:M[m].inv,profit:M[m].rent-M[m].opex}; });
  var cum=0; series.forEach(function(s){ cum+=s.rent-s.opex-s.inv; s.cum=cum; });

  var tot={rent:0,opex:0,inv:0}; rm.forEach(function(m){ tot.rent+=M[m].rent; tot.opex+=M[m].opex; tot.inv+=M[m].inv; });
  tot.profit=tot.rent-tot.opex;
  var all={rent:0,opex:0,inv:0}; months.forEach(function(m){ all.rent+=M[m].rent; all.opex+=M[m].opex; all.inv+=M[m].inv; });
  all.profit=all.rent-all.opex; all.cum=all.profit-all.inv;

  var byCat={opex:{},inv:{}};
  rows.forEach(function(r){
    if(!inR[ym(r.d)]) return; var g=grp[r.c];
    if(g==='จ่ายประจำ') byCat.opex[r.c]=(byCat.opex[r.c]||0)+r.a;
    else if(g==='ลงทุน') byCat.inv[r.c]=(byCat.inv[r.c]||0)+r.a;
  });

  var selRooms=D.rooms.filter(function(r){ return sel.indexOf(r.name)>=0; });
  var monthlyRent=0, debt=0; selRooms.forEach(function(r){ monthlyRent+=r.rent; debt+=r.inst+r.ins; });
  var feeAnnual=0; rows.forEach(function(r){ if(r.c==='ค่าส่วนกลาง') feeAnnual+=r.a; });
  var netMonthly=monthlyRent-debt-feeAnnual/12;

  var loan=D.rooms.map(function(r){
    var paid=0, intr=0; D.rows.forEach(function(x){ if(x.r===r.name && x.c==='ค่างวด'){ paid+=x.p; intr+=x.n; } });
    var rr={rent:0,opex:0,inv:0};
    D.rows.forEach(function(x){ if(x.r!==r.name) return; var g=grp[x.c];
      if(g==='รายรับ'){ if(inR[ym(x.d)]) rr.rent+=x.a; } else if(g==='จ่ายประจำ'){ if(inR[ym(x.d)]) rr.opex+=x.a; } else if(g==='ลงทุน') rr.inv+=x.a; });
    return {room:r,paid:paid,intr:intr,left:r.loan-paid,pct:r.loan? paid/r.loan : 0,rent:rr.rent,opex:rr.opex,inv:rr.inv};
  });
  var left=0, loanAmt=0; loan.forEach(function(l){ if(sel.indexOf(l.room.name)>=0){ left+=l.left; loanAmt+=l.room.loan; } });

  var personal={own:0,lent:0,deposit:0};
  D.rows.forEach(function(r){
    if(r.r==='ส่วนตัว'){ if(r.c==='ส่วนตัว') personal.own+=r.a; else if(r.c==='ให้ยืม-คืนเงินยืม') personal.lent+=r.a; }
    if(r.c==='เงินมัดจำรับจากผู้เช่า' && sel.indexOf(r.r)>=0) personal.deposit+=r.a;
  });

  var remain = all.cum>=0 ? 0 : (netMonthly>0 ? -all.cum/netMonthly : null);
  return {months:months,series:series,rm:rm,tot:tot,all:all,byCat:byCat,netMonthly:netMonthly,monthlyRent:monthlyRent,debt:debt,feeAnnual:feeAnnual,
    loan:loan,left:left,loanAmt:loanAmt,personal:personal,remain:remain,sheetMonths:(netMonthly>0&&all.inv>0)? all.inv/netMonthly : null,
    coc:(all.inv>0&&netMonthly>0)? netMonthly*12/all.inv : null, todayM:todayM, sel:sel, today:D.today};
}

/* ---- tooltip ---- */

}
function bindTip(el,fn){
  var go=function(ev){ var r=el.getBoundingClientRect(); var pt=(ev.type==='focus'); var x=pt? r.left+r.width/2 : ev.clientX; var y=pt? r.top : ev.clientY; fn(x,y,ev); };

  el.addEventListener('pointerleave',hideTip); el.addEventListener('blur',hideTip);

/* ---- แกน/สเกล ---- */
function niceStep(range){ var raw=range/4, p=Math.pow(10,Math.floor(Math.log10(raw||1))), f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function scaleY(min,max){
  if(max<=min){ max=min+1000; }
  var step=niceStep(max-min), lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(var v=lo; v<=hi+step/2; v+=step) t.push(Math.round(v*100)/100);
  return {lo:lo,hi:hi,ticks:t};
}
function newSvg(el,Ht){
  el.textContent=''; var W=Math.max(240,el.clientWidth||320);
  var svg=S('svg',{viewBox:'0 0 '+W+' '+Ht,width:W,height:Ht,role:'img'},el); return {svg:svg,W:W,H:Ht};
}
function grid(svg,sc,ml,mr,mt,mb,W,Ht){
  var ih=Ht-mt-mb, y=function(v){ return mt+ih-(v-sc.lo)/(sc.hi-sc.lo)*ih; };
  sc.ticks.forEach(function(t){
    S('line',{x1:ml,x2:W-mr,y1:y(t),y2:y(t),style:'stroke:'+(t===0?'var(--axis)':'var(--line)')+';stroke-width:1'},svg);
    var tx=S('text',{x:ml-6,y:y(t)+4,'text-anchor':'end'},svg); tx.textContent=kfmt(t);
  });
  return y;
}
function colPath(x,y0,y1,w,r){ // y0 = เส้นฐาน, y1 = ปลายแท่ง
  var up=y1<y0, h=Math.abs(y1-y0); r=Math.min(r,w/2,h); if(h<0.5) return '';
  if(up) return 'M'+x+','+y0+' L'+x+','+(y1+r)+' Q'+x+','+y1+' '+(x+r)+','+y1+' L'+(x+w-r)+','+y1+' Q'+(x+w)+','+y1+' '+(x+w)+','+(y1+r)+' L'+(x+w)+','+y0+' Z';
  return 'M'+x+','+y0+' L'+(x+w)+','+y0+' L'+(x+w)+','+(y1-r)+' Q'+(x+w)+','+y1+' '+(x+w-r)+','+y1+' L'+(x+r)+','+y1+' Q'+x+','+y1+' '+x+','+(y1-r)+' Z';
}
function xLabels(svg,months,xc,y){
  var n=months.length, every=n>8?Math.ceil(n/6):1;
  months.forEach(function(m,i){
    if(i%every!==0 && i!==n-1) return;
    var tx=S('text',{x:xc(i),y:y,'text-anchor':'middle'},svg); tx.textContent=mLabel(m, i===0||m.slice(5)==='01');
  });
}

/* ---- กราฟ: รายรับ vs ค่าใช้จ่าย (แท่งคู่) ---- */
function chartGrouped(el,data){
  var s=data.series.filter(function(x){ return data.rm.indexOf(x.m)>=0; });
  var ml=38,mr=6,mt=10,mb=24,Ht=210, c=newSvg(el,Ht), W=c.W;
  var max=0; s.forEach(function(x){ max=Math.max(max,x.rent,x.opex); });
  var sc=scaleY(0,max), y=grid(c.svg,sc,ml,mr,mt,mb,W,Ht);
  var bw=(W-ml-mr)/s.length, xc=function(i){ return ml+bw*(i+.5); };
  var w=Math.min(18,(bw-10)/2), y0=y(0);
  s.forEach(function(x,i){
    var cx=xc(i), wash=S('rect',{x:ml+bw*i,y:mt,width:bw,height:Ht-mt-mb,style:'fill:var(--wash)',opacity:0},c.svg);
    S('path',{d:colPath(cx-w-1,y0,y(x.rent),w,4),style:'fill:var(--s1)'},c.svg);
    S('path',{d:colPath(cx+1,y0,y(x.opex),w,4),style:'fill:var(--s2)'},c.svg);
    var hit=S('rect',{x:ml+bw*i,y:mt,width:bw,height:Ht-mt-mb,class:'hit',tabindex:0,'aria-label':mLabel(x.m,true)+' รายรับ '+baht(x.rent)+' ค่าใช้จ่าย '+baht(x.opex)},c.svg);
    bindTip(hit,function(px,py){ wash.setAttribute('opacity',1); showTip(px,py,mLabel(x.m,true),[{c:'var(--s1)',v:baht(x.rent),l:'รายรับ'},{c:'var(--s2)',v:baht(x.opex),l:'ค่าใช้จ่ายประจำ'}]); });
    hit.addEventListener('pointerleave',function(){ wash.setAttribute('opacity',0); }); hit.addEventListener('blur',function(){ wash.setAttribute('opacity',0); });
  });
  xLabels(c.svg,s.map(function(x){return x.m;}),xc,Ht-6);
}

/* ---- กราฟ: เงินสดสุทธิสะสม + คาดการณ์คืนทุน ---- */
function chartCum(el,data){
  var s=data.series, n=s.length, nm=data.netMonthly, pts=s.map(function(x){ return {m:x.m,v:x.cum,proj:false}; });
  var cur=s[n-1].cum, k=0;
  if(cur<0 && nm>0){ var m=s[n-1].m, v=cur; while(v<0 && k<60){ m=addMonths(m,1); v=Math.min(0,v+nm); k++; pts.push({m:m,v:v,proj:true}); } }
  var ml=44,mr=14,mt=16,mb=24,Ht=230, c=newSvg(el,Ht), W=c.W;
  var mn=0,mx=0; pts.forEach(function(p){ mn=Math.min(mn,p.v); mx=Math.max(mx,p.v); });
  var sc=scaleY(mn,mx), y=grid(c.svg,sc,ml,mr,mt,mb,W,Ht);
  var N=pts.length, xc=function(i){ return N===1? ml+(W-ml-mr)/2 : ml+(W-ml-mr)*i/(N-1); };
  var la=s.length-1;
  var path=function(a,b){ var d=''; for(var i=a;i<=b;i++) d+=(i===a?'M':'L')+xc(i).toFixed(1)+','+y(pts[i].v).toFixed(1)+' '; return d; };
  S('path',{d:path(0,la)+'L'+xc(la)+','+y(0)+' L'+xc(0)+','+y(0)+' Z',style:'fill:var(--s1);opacity:.10'},c.svg);
  S('path',{d:path(0,la),style:'fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round'},c.svg);
  if(N-1>la) S('path',{d:path(la,N-1),style:'fill:none;stroke:var(--s1);stroke-width:2;stroke-dasharray:5 5;opacity:.6;stroke-linecap:round'},c.svg);
  S('circle',{cx:xc(la),cy:y(pts[la].v),r:6,style:'fill:var(--bg)'},c.svg);
  S('circle',{cx:xc(la),cy:y(pts[la].v),r:4,style:'fill:var(--s1)'},c.svg);
  var right=(N-1>la)||la===0;   // มีเส้นคาดการณ์ไปทางขวา: วางป้ายไว้ทางขวาใต้เส้นประ ไม่ให้ทับเส้น
  var t1=S('text',{x:xc(la)+(right?10:-10),y:y(pts[la].v)+(pts[la].v<0?18:-10),'text-anchor':right?'start':'end',class:'vt'},c.svg); t1.textContent=baht(pts[la].v);
  if(N-1>la){
    S('circle',{cx:xc(N-1),cy:y(0),r:6,style:'fill:var(--bg)'},c.svg); S('circle',{cx:xc(N-1),cy:y(0),r:4,style:'fill:var(--s1);opacity:.6'},c.svg);
    var t2=S('text',{x:xc(N-1),y:y(0)-10,'text-anchor':'end',class:'vt'},c.svg); t2.textContent='คืนทุน '+mLabel(pts[N-1].m,true);
  }
  var zl=S('text',{x:ml+2,y:y(0)-5,'text-anchor':'start'},c.svg); zl.textContent='จุดคืนทุน (0)';
  var lab=[0];
  if(la>0 && xc(la)-xc(0)>=80 && (N-1===la || xc(N-1)-xc(la)>=80)) lab.push(la);   // ไม่ให้ป้ายเดือนซ้อนกัน
  if(N-1>la) lab.push(N-1);
  lab.forEach(function(i){
    var tx=S('text',{x:xc(i),y:Ht-6,'text-anchor':i===0?'start':(i===N-1?'end':'middle')},c.svg); tx.textContent=mLabel(pts[i].m,true);
  });
  var line=S('line',{y1:mt,y2:Ht-mb,style:'stroke:var(--axis);stroke-width:1',opacity:0},c.svg);
  var dot=S('circle',{r:4,style:'fill:var(--s1);stroke:var(--bg);stroke-width:2',opacity:0},c.svg);
  var hit=S('rect',{x:ml,y:mt,width:W-ml-mr,height:Ht-mt-mb,class:'hit',tabindex:0,'aria-label':'เส้นเงินสดสุทธิสะสม'},c.svg);
  bindTip(hit,function(px,py){
    var r=hit.getBoundingClientRect(), fx=(px-r.left)/r.width, i=Math.max(0,Math.min(N-1,Math.round(fx*(N-1))));
    var p=pts[i]; line.setAttribute('x1',xc(i)); line.setAttribute('x2',xc(i)); line.setAttribute('opacity',1);
    dot.setAttribute('cx',xc(i)); dot.setAttribute('cy',y(p.v)); dot.setAttribute('opacity',1);
    showTip(px,py,mLabel(p.m,true)+(p.proj?' (คาดการณ์)':''),[{c:'var(--s1)',v:baht(p.v),l:'เงินสดสุทธิสะสม'}]);
  });
  hit.addEventListener('pointerleave',function(){ line.setAttribute('opacity',0); dot.setAttribute('opacity',0); });
  hit.addEventListener('blur',function(){ line.setAttribute('opacity',0); dot.setAttribute('opacity',0); });
}

  });
  H('div','fine','ตัวเลข "อีกกี่เดือน" คิดจากเงินสะสมถึงวันนี้ ส่วนสูตรในชีทคิดจากเงินลงทุนหารเงินเข้าต่อเดือน'+(d.sheetMonths!=null? ' (ได้ '+d.sheetMonths.toFixed(1)+' เดือน)':'')+' จึงต่างกันเล็กน้อย',det);

  chartGrouped(w1,d); chartCum(w3,d);
  hbars(w4,top5(d.byCat.opex),'var(--s2)'); hbars(w5,d.byCat.inv,'var(--s3)');
  $('dashStamp').textContent='อัปเดต '+new Date(DASH_AT).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.';
}
</script>
